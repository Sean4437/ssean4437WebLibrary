<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>麗鄴電子白板-布局5</title>
    <link rel="stylesheet" href="main.css" />
    <style>
      .photo-watermark {
        font-size: calc(1rem * var(--whiteboard-overlay-scale, 1));
      }
      .field-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.35rem;
        position: relative;
      }
      .field-label-row label {
        flex: 1;
        cursor: pointer;
        transition: color 0.2s ease;
      }
      .field-label-row label:hover,
      .field-label-row label:focus-visible {
        color: #38bdf8;
      }
      .form-field[data-field-key] {
        cursor: grab;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .form-field[data-field-key].is-dragging {
        opacity: 0.65;
        cursor: grabbing;
        border: 1px dashed rgba(148, 163, 184, 0.6);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.45);
      }
      .inline-label-input {
        flex: 1;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: rgba(15, 23, 42, 0.5);
        color: #f8fafc;
        font: inherit;
        padding: 0.3rem 0.5rem;
      }
      .label-context-menu {
        position: fixed;
        top: 0;
        left: 0;
        min-width: 160px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: rgba(15, 23, 42, 0.96);
        box-shadow: 0 20px 40px rgba(2, 6, 23, 0.6);
        padding: 0.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        z-index: 2200;
      }
      .label-context-menu button {
        border-radius: 10px;
        border: 1px solid transparent;
        background: transparent;
        color: #e2e8f0;
        font-size: 0.9rem;
        padding: 0.25rem 0.5rem;
        text-align: left;
        cursor: pointer;
      }
      .label-context-menu button:hover,
      .label-context-menu button:focus-visible {
        border-color: rgba(59, 130, 246, 0.65);
        background: rgba(59, 130, 246, 0.2);
      }
      .label-context-menu .menu-section-title {
        font-size: 0.75rem;
        color: #94a3b8;
        padding: 0.15rem 0.5rem;
      }
      .label-menu-trigger {
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.4);
        color: #e2e8f0;
        border-radius: 10px;
        padding: 0.15rem 0.45rem;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .label-menu-trigger:hover,
      .label-menu-trigger:focus-visible {
        border-color: rgba(59, 130, 246, 0.65);
        background: rgba(59, 130, 246, 0.2);
      }
      .coordinate-toggle-inline {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0;
        border: none;
        background: transparent;
      }
      .field-visibility-panel {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        margin-top: 0.2rem;
      }
      .field-visibility-title {
        font-size: 0.82rem;
        color: #94a3b8;
        letter-spacing: 0.05em;
      }
      .field-visibility-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .field-visibility-toggle {
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(59, 130, 246, 0.15);
        color: #e2e8f0;
        font-size: 0.8rem;
        padding: 0.2rem 0.75rem;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }
      .field-visibility-toggle.is-hidden {
        background: transparent;
        color: #64748b;
        border-color: rgba(71, 85, 105, 0.5);
      }
      .mode-chip {
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(59, 130, 246, 0.15);
        color: #e2e8f0;
        font-size: 0.82rem;
        padding: 0.25rem 0.75rem;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }
      .mode-chip.is-active {
        background: rgba(16, 185, 129, 0.22);
        border-color: rgba(16, 185, 129, 0.55);
        color: #ecfeff;
      }
      .photo-list-panel {
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.45);
        padding: 0.65rem 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }
      .photo-list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .photo-list-count {
        font-size: 0.84rem;
        color: #cbd5e1;
      }
      .photo-list-actions {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .photo-list-actions .ghost-btn {
        margin: 0;
        padding: 0.28rem 0.72rem;
        font-size: 0.8rem;
      }
      .photo-list {
        display: flex;
        gap: 0.45rem;
        overflow-x: auto;
        padding-bottom: 0.2rem;
      }
      .photo-item-btn {
        border: 2px solid rgba(148, 163, 184, 0.28);
        background: rgba(15, 23, 42, 0.7);
        border-radius: 12px;
        color: #cbd5e1;
        min-width: 84px;
        padding: 0.3rem;
        cursor: pointer;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
      }
      .photo-item-btn.is-active {
        border-color: rgba(59, 130, 246, 0.85);
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.45);
      }
      .photo-item-thumb {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 8px;
      }
      .photo-item-index {
        font-size: 0.74rem;
        letter-spacing: 0.04em;
        max-width: 72px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .action-bar {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .action-btn[hidden] {
        display: none;
      }
      @media (max-width: 640px) {
        .action-bar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .action-btn--wide {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="field-visibility-panel">
        <span class="field-visibility-title">欄位顯示</span>
        <div class="field-visibility-list">
          <button type="button" class="field-visibility-toggle" data-field-visibility="projectName">工程名稱</button>
          <button type="button" class="field-visibility-toggle" data-field-visibility="inspectionLocation">檢查位置</button>
          <button type="button" class="field-visibility-toggle" data-field-visibility="testDate">檢查日期</button>
          <button type="button" class="field-visibility-toggle" data-field-visibility="inspector">檢查人員</button>
          <button type="button" class="field-visibility-toggle" data-field-visibility="testResult">檢查紀錄</button>
        </div>
      </div>

      <section class="panel">
        <h3>資料輸入面板</h3>
        <div class="data-grid" id="fieldOrderContainer">
          <div class="form-field" data-field-key="projectName">
            <div class="field-label-row">
              <label for="inputProjectName" data-field-label="projectName">工程名稱</label>
            </div>
            <input
              id="inputProjectName"
              type="text"
              placeholder="請輸入工程名稱"
              autocomplete="off"
            />
            <div class="history-dropdown" id="projectNameHistoryDropdown"></div>
          </div>
          <div class="form-field" data-field-key="inspectionLocation">
            <div class="field-label-row">
              <label for="inputInspectionLocation" data-field-label="inspectionLocation">檢查位置</label>
            </div>
            <input
              id="inputInspectionLocation"
              type="text"
              placeholder="請輸入檢查位置"
              autocomplete="off"
            />
            <div class="history-dropdown" id="inspectionLocationHistoryDropdown"></div>
          </div>
          <div class="form-field" data-field-key="testDate">
            <div class="field-label-row">
              <label for="inputTestDate" data-field-label="testDate">檢查日期</label>
            </div>
            <input id="inputTestDate" type="date" />
          </div>
          <div class="form-field" data-field-key="inspector">
            <div class="field-label-row">
              <label for="inputInspector" data-field-label="inspector">檢查人員</label>
            </div>
            <input
              id="inputInspector"
              type="text"
              placeholder="請輸入檢查人員"
              autocomplete="off"
            />
            <div class="history-dropdown" id="inspectorHistoryDropdown"></div>
          </div>
          <div class="form-field" data-field-key="testResult" style="grid-column: 1 / -1">
            <div class="field-label-row">
              <label for="inputTestResult" data-field-label="testResult">檢查紀錄</label>
            </div>
            <textarea
              id="inputTestResult"
              placeholder="寫下檢查內容、測量結果等"
              autocomplete="off"
            ></textarea>
            <div class="history-dropdown" id="testResultHistoryDropdown"></div>
          </div>
        </div>
        <div class="panel-actions">
          <label class="panel-control">
            <span>文字大小</span>
            <input type="range" id="fontScale" min="80" max="300" value="200" />
            <span id="fontScaleValue">200%</span>
          </label>
          <label class="panel-control">
            <span>白板寬度</span>
            <input type="range" id="boardWidth" min="240" max="640" value="350" />
            <span id="boardWidthValue">350px</span>
          </label>
          <div class="color-preset-group" role="group" aria-label="白板配色快捷">
            <button
              type="button"
              class="color-swatch"
              style="--swatch-color: #f8fafc"
              data-color-preset
              data-board-color="#f8fafc"
              data-text-color="#0f172a"
              data-line-color="#000000"
              data-board-opacity="100"
              aria-label="白色主題"
            >
              <span class="sr-only">白色主題</span>
            </button>
            <button
              type="button"
              class="color-swatch"
              style="--swatch-color: #065f46"
              data-color-preset
              data-board-color="#065f46"
              data-text-color="#f8fafc"
              data-line-color="#f8fafc"
              data-board-opacity="100"
              aria-label="綠色主題"
            >
              <span class="sr-only">綠色主題</span>
            </button>
            <button
              type="button"
              class="color-swatch"
              style="--swatch-color: rgba(15, 23, 42, 0.5)"
              data-color-preset
              data-board-color="#1f293b"
              data-text-color="#f8fafc"
              data-line-color="#f8fafc"
              data-board-opacity="85"
              aria-label="半透明灰主題"
            >
              <span class="sr-only">半透明灰主題</span>
            </button>
            <button
              type="button"
              class="color-swatch"
              style="--swatch-color: rgba(255, 255, 255, 0.8)"
              data-color-preset
              data-board-color="#f8fafc"
              data-text-color="#0f172a"
              data-line-color="#000000"
              data-board-opacity="82"
              aria-label="半透明白主題"
            >
              <span class="sr-only">半透明白主題</span>
            </button>
            <button
              type="button"
              class="color-swatch color-swatch--toggle"
              id="toggleBoardButton"
              aria-pressed="true"
              data-board-visible="true"
            >
              <span class="sr-only">白板顯示開關</span>
              <span id="boardVisibilityLabel">白板開</span>
            </button>
            <div class="coordinate-toggle-inline">
              <button type="button" class="coordinate-toggle-btn" id="coordinateFormatButton">
                <strong id="coordinateFormatText">97</strong>
              </button>
            </div>
          </div>
        </div>
        <button type="button" class="ghost-btn toggle-advanced" id="toggleAdvanced">顯示更多調整</button>
        <div class="panel-actions advanced-controls" id="advancedControls" hidden>
          <label class="panel-control">
            <span>白板尺寸</span>
            <input type="range" id="boardScale" min="10" max="120" value="45" />
            <span id="boardScaleValue">45%</span>
          </label>
          <label class="panel-control">
            <span>輸出尺寸</span>
            <div class="size-toggle-group" role="group" aria-label="輸出尺寸選擇">
              <button type="button" class="size-toggle" data-export-size="small">小</button>
              <button type="button" class="size-toggle is-active" data-export-size="medium">中</button>
              <button type="button" class="size-toggle" data-export-size="large">大</button>
            </div>
          </label>
          <label class="panel-control">
            <span>座標紀錄</span>
            <div class="history-actions">
              <button type="button" class="ghost-btn ghost-button--accent" id="downloadCoordinateHistory">下載紀錄</button>
              <button type="button" class="ghost-btn ghost-button--accent" id="downloadCoordinateHistoryKml">下載 KML</button>
              <button type="button" class="ghost-btn ghost-button--danger" id="clearCoordinateHistory">清除紀錄</button>
            </div>
          </label>
          <label class="panel-control">
            <span>白板傾斜</span>
            <input type="range" id="boardRotation" min="-20" max="20" value="0" />
            <span id="boardRotationValue">0°</span>
          </label>
          <label class="panel-control">
            <span>白板顏色</span>
            <input type="color" id="boardColor" value="#f8fafc" />
          </label>
          <label class="panel-control">
            <span>透明度</span>
            <input type="range" id="boardOpacity" min="70" max="100" value="96" />
            <span id="boardOpacityValue">96%</span>
          </label>
          <label class="panel-control">
            <span>文字顏色</span>
            <input type="color" id="textColor" value="#0f172a" />
          </label>
          <label class="panel-control">
            <span>格線顏色</span>
            <input type="color" id="lineColor" value="#000000" />
          </label>
        </div>
      </section>

      <div class="controls">
        <button class="btn" id="takePhotoBtn">拍照</button>
        <button class="btn btn-secondary" id="uploadPhotoBtn">上傳照片</button>
        <button class="mode-chip" id="multiModeBtn" type="button" aria-pressed="false">多張模式：關</button>
        <button class="mode-chip" id="displayModeBtn" type="button">顯示：完整白板</button>
      </div>

      <div class="stage" id="captureArea">
        <div class="stage-content" id="photoLayer">
          <img id="photoImage" alt="拍攝預覽" hidden />
          <div class="stage-placeholder" id="placeholder">
            <strong>請拍照或上傳照片</strong>
            <span>白板會顯示在畫面上，可拖曳與縮放。</span>
          </div>
        </div>
        <div class="whiteboard-wrapper" id="whiteboardWrapper">
          <div class="whiteboard" id="whiteboard">
            <div class="whiteboard-content" id="whiteboardFields"></div>
          </div>
        </div>
        <div class="photo-watermark photo-watermark--top-right" id="photoCoordinate" hidden>座標未取得</div>
        <div class="photo-watermark" id="photoWatermark">日期未設定</div>
      </div>
      <div class="photo-list-panel" id="photoListPanel" hidden>
        <div class="photo-list-header">
          <span class="photo-list-count" id="photoListCount">0 張照片</span>
          <div class="photo-list-actions">
            <button type="button" class="ghost-btn" id="prevPhotoBtn">上一張</button>
            <button type="button" class="ghost-btn" id="nextPhotoBtn">下一張</button>
            <button type="button" class="ghost-btn ghost-button--danger" id="clearPhotoListBtn">清空照片</button>
          </div>
        </div>
        <div class="photo-list" id="photoList"></div>
      </div>

      <div class="action-bar">
        <button class="action-btn secondary" id="clearBoardBtn">清除白板</button>
        <button class="action-btn primary" id="exportBtn">匯出整張圖片</button>
        <button class="action-btn secondary action-btn--wide" id="exportAllBtn" hidden>批次匯出全部</button>
      </div>

  <p id="toastMessage" class="toast-message" role="status" aria-live="polite"></p>

      <input type="file" accept="image/*" capture="environment" class="hidden-input" id="takePhotoInput" />
      <input type="file" accept="image/*" class="hidden-input" id="uploadInput" multiple />
    </div>

    <script src="vendor/piexif.min.js"></script>
    <script src="vendor/html2canvas.min.js"></script>
    
    <script>
const takePhotoBtn = document.getElementById("takePhotoBtn");
      const uploadPhotoBtn = document.getElementById("uploadPhotoBtn");
      const takePhotoInput = document.getElementById("takePhotoInput");
      const uploadInput = document.getElementById("uploadInput");
      const photoLayer = document.getElementById("photoLayer");
      const photoImage = document.getElementById("photoImage");
      const placeholder = document.getElementById("placeholder");
      const whiteboardWrapper = document.getElementById("whiteboardWrapper");
      const whiteboard = document.getElementById("whiteboard");
      const whiteboardFields = document.getElementById("whiteboardFields");
      const captureArea = document.getElementById("captureArea");
      const boardScaleInput = document.getElementById("boardScale");
      const boardScaleValue = document.getElementById("boardScaleValue");
      const boardWidthInput = document.getElementById("boardWidth");
      const boardWidthValue = document.getElementById("boardWidthValue");
      const fontScaleInput = document.getElementById("fontScale");
      const fontScaleValue = document.getElementById("fontScaleValue");
      const boardRotationInput = document.getElementById("boardRotation");
      const boardRotationValue = document.getElementById("boardRotationValue");
      const boardColorInput = document.getElementById("boardColor");
      const boardOpacityInput = document.getElementById("boardOpacity");
      const boardOpacityValue = document.getElementById("boardOpacityValue");
      const textColorInput = document.getElementById("textColor");
      const lineColorInput = document.getElementById("lineColor");
      const coordinateFormatButton = document.getElementById("coordinateFormatButton");
      const coordinateFormatText = document.getElementById("coordinateFormatText");
      const exportSizeButtons = document.querySelectorAll("[data-export-size]");
      const downloadCoordinateHistoryBtn = document.getElementById("downloadCoordinateHistory");
      const downloadCoordinateHistoryKmlBtn = document.getElementById("downloadCoordinateHistoryKml");
      const clearCoordinateHistoryBtn = document.getElementById("clearCoordinateHistory");
      const boardVisibilityButton = document.getElementById("toggleBoardButton");
      const boardVisibilityLabel = document.getElementById("boardVisibilityLabel");
      const colorPresetButtons = document.querySelectorAll("[data-color-preset]");
      const clearBoardBtn = document.getElementById("clearBoardBtn");
      const exportBtn = document.getElementById("exportBtn");
      const exportAllBtn = document.getElementById("exportAllBtn");
      const toastMessage = document.getElementById("toastMessage");
      const photoWatermark = document.getElementById("photoWatermark");
      const photoCoordinate = document.getElementById("photoCoordinate");
      const multiModeBtn = document.getElementById("multiModeBtn");
      const displayModeBtn = document.getElementById("displayModeBtn");
      const photoListPanel = document.getElementById("photoListPanel");
      const photoListCount = document.getElementById("photoListCount");
      const photoList = document.getElementById("photoList");
      const prevPhotoBtn = document.getElementById("prevPhotoBtn");
      const nextPhotoBtn = document.getElementById("nextPhotoBtn");
      const clearPhotoListBtn = document.getElementById("clearPhotoListBtn");
      whiteboardWrapper.dataset.userPositioned = "false";
      const advancedControls = document.getElementById("advancedControls");
      const toggleAdvanced = document.getElementById("toggleAdvanced");

      const isMobileDevice = /android|iphone|ipad|ipod|mobile/i.test(
        (navigator.userAgent || "").toLowerCase()
      );
      const GEOLOCATION_TIMEOUT_MS = 15000;
      let lastPhotoMetadata = null;
      let lastPhotoExifBytes = null;
      let pendingCaptureCoordinatesPromise = null;
      let isMultiMode = false;
      let photoItems = [];
      let activePhotoIndex = -1;
      let photoSequence = 0;

      const layoutIdentifier =
        document.body.dataset.layoutId ||
        (window.location.pathname.match(/layout(\d+)/)?.[1] && `layout${window.location.pathname.match(/layout(\d+)/)[1]}`) ||
        "layout";
      const buildStorageKey = (base) => `${base}_${layoutIdentifier}`;
      const FIELD_HISTORY_STORAGE_KEY = buildStorageKey("whiteboard_field_history");
      const FIELD_HISTORY_LIMIT = 20;
      const WHITEBOARD_VISIBILITY_STORAGE_KEY = buildStorageKey("whiteboard_visibility");
      const EXPORT_SIZE_STORAGE_KEY = buildStorageKey("whiteboard_export_size");
      const COORDINATE_HISTORY_STORAGE_KEY = buildStorageKey("whiteboard_coordinate_history");
      const COORDINATE_FORMAT_STORAGE_KEY = buildStorageKey("whiteboard_coordinate_format");
      const DISPLAY_MODE_STORAGE_KEY = buildStorageKey("whiteboard_display_mode");
      const COORDINATE_FORMATS = {
        WGS84: "wgs84",
        TWD97: "twd97",
        NONE: "none",
      };
      const COORDINATE_FORMAT_SEQUENCE = [
        COORDINATE_FORMATS.TWD97,
        COORDINATE_FORMATS.WGS84,
        COORDINATE_FORMATS.NONE,
      ];
      const COORDINATE_HISTORY_LIMIT = 500;
      const EXIF_INSERT_MAX_DATAURL_LENGTH = 12_000_000;
      let coordinateFormat = COORDINATE_FORMATS.TWD97;
      const DISPLAY_MODES = {
        FULL: "full",
        META_ONLY: "meta_only",
        NONE: "none",
      };
      const DISPLAY_MODE_SEQUENCE = [
        DISPLAY_MODES.FULL,
        DISPLAY_MODES.META_ONLY,
        DISPLAY_MODES.NONE,
      ];
      const DISPLAY_MODE_LABEL_MAP = {
        [DISPLAY_MODES.FULL]: "顯示：完整白板",
        [DISPLAY_MODES.META_ONLY]: "顯示：只顯示日期+座標",
        [DISPLAY_MODES.NONE]: "顯示：全部隱藏",
      };
      let displayMode = DISPLAY_MODES.FULL;
      let boardVisibilityPreference = true;
      const EXPORT_SIZE_SCALE = {
        small: 0.8,
        medium: 1,
        large: 1.5,
      };
      const EXPORT_RENDER_TIMEOUT_MS = 6500;
      const EXPORT_RENDER_RETRY_TIMEOUT_MS = 12000;
      const EXPORT_SCALE_MAX = 1.8;
      const EXPORT_RETRY_SCALE = 1.0;
      const EXPORT_FINAL_RETRY_SCALE = 0.8;
      const EXPORT_ULTRA_RETRY_SCALE = 0.62;
      const EXPORT_MIN_SCALE = 0.45;
      const EXPORT_MAX_TOTAL_PIXELS = 2_600_000;
      const EXPORT_TARGET_MAX_BYTES = 2_400_000;
      const EXPORT_JPEG_START_QUALITY = 0.9;
      const EXPORT_JPEG_MIN_QUALITY = 0.62;
      const EXPORT_JPEG_QUALITY_STEP = 0.07;
      const EXPORT_EXIF_MAX_BLOB_BYTES = 2_000_000;
      const EXPORT_FAST_MAX_SCALE_MOBILE = 1.15;
      const EXPORT_FAST_MAX_SCALE_DESKTOP = 1.5;
      const EXPORT_KEEP_EXIF = false;
      const EXPORT_PREFER_MANUAL_PIPELINE = true;

      const degToRad = (value) => (value * Math.PI) / 180;

      const convertToTwd97 = (latitude, longitude) => {
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;
        try {
          const a = 6378137.0;
          const f = 1 / 298.257222101;
          const b = a * (1 - f);
          const e2 = (a * a - b * b) / (a * a);
          const ePrime2 = (a * a - b * b) / (b * b);
          const k0 = 0.9999;
          const lon0 = degToRad(121);
          const x0 = 250000;
          const y0 = 0;
          const latRad = degToRad(latitude);
          const lonRad = degToRad(longitude);
          const sinLat = Math.sin(latRad);
          const cosLat = Math.cos(latRad);
          const tanLat = Math.tan(latRad);
          const N = a / Math.sqrt(1 - e2 * sinLat * sinLat);
          const T = tanLat * tanLat;
          const C = ePrime2 * cosLat * cosLat;
          const A = (lonRad - lon0) * cosLat;
          const e4 = e2 * e2;
          const e6 = e4 * e2;
          const M =
            a *
            ((1 - e2 / 4 - (3 * e4) / 64 - (5 * e6) / 256) * latRad -
              ((3 * e2) / 8 + (3 * e4) / 32 + (45 * e6) / 1024) * Math.sin(2 * latRad) +
              ((15 * e4) / 256 + (45 * e6) / 1024) * Math.sin(4 * latRad) -
              ((35 * e6) / 3072) * Math.sin(6 * latRad));

          const x =
            x0 +
            k0 *
              N *
              (A +
                ((1 - T + C) * Math.pow(A, 3)) / 6 +
                ((5 - 18 * T + T * T + 72 * C - 58 * ePrime2) * Math.pow(A, 5)) / 120);

          const y =
            y0 +
            k0 *
              (M +
                N *
                  tanLat *
                  (Math.pow(A, 2) / 2 +
                    ((5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4)) / 24 +
                    ((61 - 58 * T + T * T + 600 * C - 330 * ePrime2) * Math.pow(A, 6)) / 720));
          return [x, y];
        } catch (error) {
          console.warn("TWD97 轉換失敗", error);
          return null;
        }

      const downloadCoordinateHistoryKml = () => {

${description ? `      ${description}\n` : ""}      <Point>

<kml xmlns="http://www.opengis.net/kml/2.2">

${placemarks}

      const resolveCoordinateText = () => {

      const updateCoordinateOverlay = () => {

      const setCoordinateFormat = (value) => {

      const decimalToDmsRational = (value) => {
        const abs = Math.abs(value);
        const degrees = Math.floor(abs);
        const minutesFloat = (abs - degrees) * 60;
        const minutes = Math.floor(minutesFloat);
        const seconds = (minutesFloat - minutes) * 60;
        const toRational = (num) => [Math.round(num * 100), 100];
        return [
          [degrees, 1],
          [minutes, 1],
          toRational(seconds),
        ];
      };

      const toExifDateTime = (dateStr) =>
        `${dateStr.replace(/-/g, ":")} 00:00:00`;

      const applyExifToDataUrl = (dataUrl) => {
        if (!window.piexif) return dataUrl;
        if (typeof dataUrl === "string" && dataUrl.length > EXIF_INSERT_MAX_DATAURL_LENGTH) {
          return dataUrl;
        }
        try {
          if (lastPhotoExifBytes) {
            return piexif.insert(lastPhotoExifBytes, dataUrl);
          }
          if (!lastPhotoMetadata) return dataUrl;
          const zeroth = {};
          const exif = {};
          const gps = {};
          if (lastPhotoMetadata.date) {
            const dateTime = toExifDateTime(lastPhotoMetadata.date);
            zeroth[piexif.ImageIFD.DateTime] = dateTime;
            exif[piexif.ExifIFD.DateTimeOriginal] = dateTime;
            exif[piexif.ExifIFD.CreateDate] = dateTime;
          }
          if (lastPhotoMetadata.gps) {
            const { latitude, longitude } = lastPhotoMetadata.gps;
            if (
              typeof latitude === "number" &&
              !Number.isNaN(latitude) &&
              typeof longitude === "number" &&
              !Number.isNaN(longitude)
            ) {
              gps[piexif.GPSIFD.GPSLatitudeRef] = latitude >= 0 ? "N" : "S";
              gps[piexif.GPSIFD.GPSLatitude] = decimalToDmsRational(latitude);
              gps[piexif.GPSIFD.GPSLongitudeRef] = longitude >= 0 ? "E" : "W";
              gps[piexif.GPSIFD.GPSLongitude] = decimalToDmsRational(longitude);
            }
          }
          if (!Object.keys(zeroth).length && !Object.keys(exif).length && !Object.keys(gps).length) {
            return dataUrl;
          }
          const exifBytes = piexif.dump({
            "0th": zeroth,
            Exif: exif,
            GPS: gps,
          });
          return piexif.insert(exifBytes, dataUrl);
        } catch (error) {
          console.warn("EXIF 寫入失敗", error);
          return dataUrl;
        }
      };

      const dataUrlToBlob = (dataUrl) => {
        const [header, data] = dataUrl.split(",");
        const mimeMatch = header.match(/:(.*?);/);
        const mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
        const binary = atob(data);
        const array = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          array[i] = binary.charCodeAt(i);
        }
        return new Blob([array], { type: mime });
      };

      const blobToDataUrl = (blob) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            if (typeof reader.result === "string" && reader.result) {
              resolve(reader.result);
              return;
            }
            reject(new Error("BLOB_READ_FAILED"));
          };
          reader.onerror = () => reject(new Error("BLOB_READ_FAILED"));
          reader.readAsDataURL(blob);
        });

      const canvasToBlob = (canvas, quality = 0.92) =>
        new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) => {
              if (blob) {
                resolve(blob);
                return;
              }
              const err = new Error("CANVAS_ENCODE_FAILED");
              err.code = "CANVAS_ENCODE_FAILED";
              reject(err);
            },
            "image/jpeg",
            quality
          );
        });

      const encodeCanvasAsJpeg = async (canvas, options = {}) => {
        const maxBytes = Number(options.maxBytes || EXPORT_TARGET_MAX_BYTES);
        const minQuality = Number(options.minQuality || EXPORT_JPEG_MIN_QUALITY);
        const qualityStep = Number(options.qualityStep || EXPORT_JPEG_QUALITY_STEP);
        let quality = Number(options.startQuality || EXPORT_JPEG_START_QUALITY);
        let blob = await canvasToBlob(canvas, quality);
        while (blob.size > maxBytes && quality > minQuality) {
          quality = Math.max(minQuality, Number((quality - qualityStep).toFixed(2)));
          blob = await canvasToBlob(canvas, quality);
          if (quality === minQuality) break;
        }
        return blob;
      };

      const attachExifToBlob = async (blob) => {
        if (!window.piexif || !blob || blob.size > EXPORT_EXIF_MAX_BLOB_BYTES) {
          return blob;
        }
        try {
          const sourceDataUrl = await blobToDataUrl(blob);
          const withExifDataUrl = applyExifToDataUrl(sourceDataUrl);
          if (!withExifDataUrl || withExifDataUrl === sourceDataUrl) {
            return blob;
          }
          return dataUrlToBlob(withExifDataUrl);
        } catch (error) {
          console.warn("EXIF blob 寫入失敗", error);
          return blob;
        }
      };

      const parsePercent = (value) => {
        if (typeof value !== "string") return null;
        const trimmed = value.trim();
        if (!trimmed.endsWith("%")) return null;
        const parsed = Number.parseFloat(trimmed.slice(0, -1));
        return Number.isFinite(parsed) ? parsed / 100 : null;
      };

      const clampNumber = (value, min, max) => Math.min(max, Math.max(min, value));

      const resolveManualOutputDimensions = () => {
        const sourceWidth =
          photoImage.naturalWidth || photoImage.width || captureArea.clientWidth || 1;
        const sourceHeight =
          photoImage.naturalHeight || photoImage.height || captureArea.clientHeight || 1;
        const sourceLongEdge = Math.max(sourceWidth, sourceHeight);
        const targetLongEdge =
          EXPORT_MANUAL_LONG_EDGE[exportSize] || EXPORT_MANUAL_LONG_EDGE.medium;
        const ratio =
          sourceLongEdge > targetLongEdge ? targetLongEdge / sourceLongEdge : 1;
        return {
          width: Math.max(1, Math.round(sourceWidth * ratio)),
          height: Math.max(1, Math.round(sourceHeight * ratio)),
        };
      };

      const mapRectToOutput = (rect, stageRect, outputWidth, outputHeight) => {
        const stageWidth = stageRect.width || 1;
        const stageHeight = stageRect.height || 1;
        const x = ((rect.left - stageRect.left) / stageWidth) * outputWidth;
        const y = ((rect.top - stageRect.top) / stageHeight) * outputHeight;
        const width = (rect.width / stageWidth) * outputWidth;
        const height = (rect.height / stageHeight) * outputHeight;
        return {
          x,
          y,
          width,
          height,
          right: x + width,
          bottom: y + height,
        };
      };

      const drawTextOverlayFromElement = (
        ctx,
        element,
        stageRect,
        outputWidth,
        outputHeight,
        options = {}
      ) => {
        if (!element || element.hidden) return;
        const text = (element.textContent || "").trim();
        if (!text) return;
        const rect = element.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const mapped = mapRectToOutput(rect, stageRect, outputWidth, outputHeight);
        const style = window.getComputedStyle(element);
        const domFontSize = Number.parseFloat(style.fontSize || "16");
        const fontSize = Math.max(
          12,
          (Number.isFinite(domFontSize) ? domFontSize : 16) *
            (outputHeight / Math.max(1, stageRect.height))
        );
        const weight = style.fontWeight || "700";
        const family = style.fontFamily || "sans-serif";
        const lineHeight = fontSize * 1.15;
        const lines = text.split(/\n+/).filter(Boolean);
        if (!lines.length) return;
        const align = options.align || "right";
        const vertical = options.vertical || "bottom";
        const x =
          align === "left"
            ? mapped.x
            : align === "center"
              ? mapped.x + mapped.width / 2
              : mapped.right;
        let y = vertical === "top" ? mapped.y : mapped.bottom;
        if (vertical !== "top") {
          y -= lineHeight * Math.max(0, lines.length - 1);
        }
        ctx.save();
        ctx.font = `${weight} ${fontSize}px ${family}`;
        ctx.fillStyle = style.color || "#fbbf24";
        ctx.strokeStyle = "rgba(0, 0, 0, 0.9)";
        ctx.lineWidth = Math.max(1, fontSize * 0.08);
        ctx.textAlign = align;
        ctx.textBaseline = "top";
        lines.forEach((line, index) => {
          const yy = y + index * lineHeight;
          ctx.strokeText(line, x, yy);
          ctx.fillText(line, x, yy);
        });
        ctx.restore();
      };

      const captureWhiteboardCanvas = async () => {
        if (typeof html2canvas !== "function" || !whiteboard) return null;
        return withTimeout(
          html2canvas(whiteboard, {
            backgroundColor: null,
            scale: 1,
            logging: false,
            imageTimeout: 0,
            removeContainer: true,
          }),
          EXPORT_FALLBACK_BOARD_TIMEOUT_MS,
          "BOARD_CAPTURE_TIMEOUT"
        );
      };

      const drawWhiteboardOverlay = async (ctx, stageRect, outputWidth, outputHeight) => {
        if (!whiteboardWrapper || !whiteboard || whiteboardWrapper.hidden) return;
        let boardCanvas = null;
        try {
          boardCanvas = await captureWhiteboardCanvas();
        } catch (error) {
          console.warn("白板疊圖渲染失敗，略過白板疊圖", error);
          return;
        }
        if (!boardCanvas) return;
        const style = window.getComputedStyle(whiteboardWrapper);
        const centerXPercent = parsePercent(style.left);
        const centerYPercent = parsePercent(style.top);
        const wrapperRect = whiteboardWrapper.getBoundingClientRect();
        const fallbackCenter = mapRectToOutput(
          wrapperRect,
          stageRect,
          outputWidth,
          outputHeight
        );
        const centerX =
          centerXPercent !== null
            ? clampNumber(centerXPercent, 0, 1) * outputWidth
            : fallbackCenter.x + fallbackCenter.width / 2;
        const centerY =
          centerYPercent !== null
            ? clampNumber(centerYPercent, 0, 1) * outputHeight
            : fallbackCenter.y + fallbackCenter.height / 2;
        const scale = Number.parseFloat(style.getPropertyValue("--board-scale")) || 1;
        const rotationValue =
          window.getComputedStyle(document.documentElement).getPropertyValue("--board-rotation") ||
          "0deg";
        const rotationDeg = Number.parseFloat(rotationValue) || 0;
        const baseWidth = whiteboard.offsetWidth || boardCanvas.width || 1;
        const baseHeight = whiteboard.offsetHeight || boardCanvas.height || 1;
        const unitScaleX = outputWidth / Math.max(1, stageRect.width);
        const unitScaleY = outputHeight / Math.max(1, stageRect.height);
        const drawWidth = baseWidth * scale * unitScaleX;
        const drawHeight = baseHeight * scale * unitScaleY;
        const rotationRad = (rotationDeg * Math.PI) / 180;
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(rotationRad);
        ctx.drawImage(boardCanvas, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();
      };

      const renderExportBlobManual = async (options = {}) => {
        if (!photoImage || photoImage.hidden || !photoImage.naturalWidth) {
          const err = new Error("NO_PHOTO_FOR_EXPORT");
          err.code = "NO_PHOTO_FOR_EXPORT";
          throw err;
        }
        const stageRect = captureArea.getBoundingClientRect();
        if (!stageRect.width || !stageRect.height) {
          const err = new Error("INVALID_STAGE_SIZE");
          err.code = "INVALID_STAGE_SIZE";
          throw err;
        }
        const output = resolveManualOutputDimensions();
        const canvas = document.createElement("canvas");
        canvas.width = output.width;
        canvas.height = output.height;
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          const err = new Error("CANVAS_CONTEXT_FAILED");
          err.code = "CANVAS_CONTEXT_FAILED";
          throw err;
        }
        const exportBg =
          (captureArea && window.getComputedStyle(captureArea).backgroundColor) || "#0f172a";
        ctx.fillStyle = exportBg;
        ctx.fillRect(0, 0, output.width, output.height);
        ctx.drawImage(photoImage, 0, 0, output.width, output.height);
        await drawWhiteboardOverlay(ctx, stageRect, output.width, output.height);
        drawTextOverlayFromElement(ctx, photoCoordinate, stageRect, output.width, output.height, {
          align: "right",
          vertical: "top",
        });
        drawTextOverlayFromElement(ctx, photoWatermark, stageRect, output.width, output.height, {
          align: "right",
          vertical: "bottom",
        });
        let blob = await encodeCanvasAsJpeg(canvas, {
          maxBytes: EXPORT_TARGET_MAX_BYTES,
          startQuality: EXPORT_JPEG_START_QUALITY,
          minQuality: EXPORT_JPEG_MIN_QUALITY,
          qualityStep: EXPORT_JPEG_QUALITY_STEP,
        });
        if (EXPORT_KEEP_EXIF) {
          blob = await attachExifToBlob(blob);
        }
        const isPortrait = output.height >= output.width;
        const timestamp = new Date().toISOString().replace(/[T:]/g, "-").split(".")[0];
        const baseName = sanitizeFileBaseName(options.filenameBase || "whiteboard", "whiteboard");
        const filename = `${baseName}_${timestamp}${isPortrait ? "_portrait" : "_landscape"}.jpg`;
        return { blob, filename };
      };

      const readFieldHistoryStore = () => {
        try {
          const raw = localStorage.getItem(FIELD_HISTORY_STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return typeof parsed === "object" && parsed ? parsed : {};
        } catch (error) {
          console.warn("讀取歷史資料失敗", error);
          return {};
        }
      };

      let fieldHistory = readFieldHistoryStore();

      const writeFieldHistoryStore = () => {
        try {
          localStorage.setItem(FIELD_HISTORY_STORAGE_KEY, JSON.stringify(fieldHistory));
        } catch (error) {
          console.warn("儲存歷史資料失敗", error);
        }
      };

      const getFieldHistory = (field) => {
        const list = fieldHistory[field];
        return Array.isArray(list) ? list : [];
      };

      const saveFieldHistory = (field, value) => {
        const trimmed = (value || "").trim();
        if (!trimmed) return;
        const current = getFieldHistory(field).filter((item) => item !== trimmed);
        current.unshift(trimmed);
        fieldHistory[field] = current.slice(0, FIELD_HISTORY_LIMIT);
        writeFieldHistoryStore();
        updateDropdownContent(field);
      };
      const renderHistoryDropdown = (field) => {
        const dropdown = historyDropdowns[field];
        if (!dropdown) return false;
        dropdown.innerHTML = "";
        const history = getFieldHistory(field);
        if (!history.length) return false;
        history.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = item;
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            const targetInput = formInputs[field];

      const updateDropdownContent = (field) => {

          renderHistoryDropdown(field);

      const historyDropdownHideTimers = {};

      const showFieldHistory = (field) => {

        clearTimeout(historyDropdownHideTimers[field]);
        const hasItems = renderHistoryDropdown(field);
        if (hasItems) {
          dropdown.classList.add("is-visible");
        }
      };

      const hideFieldHistory = (field) => {
        const dropdown = historyDropdowns[field];
        if (!dropdown) return;
        dropdown.classList.remove("is-visible");
      };

      const scheduleHideFieldHistory = (field) => {
        clearTimeout(historyDropdownHideTimers[field]);
        historyDropdownHideTimers[field] = setTimeout(
          () => hideFieldHistory(field),
          120
        );
      };

      const formatDateInputValue = (date) => {
        if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "";
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${date.getFullYear()}-${month}-${day}`;
      };

      const readFileAsDataURL = (file) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("failed to load file"));
          reader.readAsDataURL(file);
        });

      const requestCaptureCoordinates = () => {
        if (!navigator.geolocation) {
          pendingCaptureCoordinatesPromise = Promise.resolve(null);
          return pendingCaptureCoordinatesPromise;
        }
        pendingCaptureCoordinatesPromise = new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude } = position.coords || {};
              if (
                typeof latitude === "number" &&
                !Number.isNaN(latitude) &&
                typeof longitude === "number" &&
                !Number.isNaN(longitude)
              ) {
                resolve({ latitude, longitude });
              } else {
                resolve(null);
              }
            },
            (error) => {
              console.warn("定位失敗，無法寫入座標。", error);
              resolve(null);
            },
            { enableHighAccuracy: true, timeout: GEOLOCATION_TIMEOUT_MS, maximumAge: 0 }
          );
        });
        return pendingCaptureCoordinatesPromise;
      };

      const consumePendingCaptureCoordinates = async () => {
        if (!pendingCaptureCoordinatesPromise) return null;
        try {
          return await pendingCaptureCoordinatesPromise;
        } catch (error) {
          console.warn("讀取定位資訊失敗", error);
          return null;
        } finally {
          pendingCaptureCoordinatesPromise = null;
        }
      };

      const asciiFromView = (view, start, length) => {
        let chars = "";
        for (let i = 0; i < length && start + i < view.byteLength; i += 1) {
          const code = view.getUint8(start + i);
          if (!code) break;
          chars += String.fromCharCode(code);
        }
        return chars.trim();
      };

      const normalizeExifDate = (value) => {
        if (!value) return null;
        const match = value.match(/^(\d{4}):?(\d{2}):?(\d{2})/);
        if (!match) return null;
        const [, year, month, day] = match;
        return `${year}-${month}-${day}`;
      };

      const TYPE_SIZES = {
        1: 1,
        2: 1,
        3: 2,
        4: 4,
        5: 8,
        7: 1,
      };

      const EXIF_DATE_TAGS = new Set([0x0132, 0x9003, 0x9004]);

      const GPS_TAGS = {
        LAT_REF: 0x0001,
        LAT: 0x0002,
        LON_REF: 0x0003,
        LON: 0x0004,
      };

      const readRationalArray = (view, offset, little, count) => {
        const result = [];
        for (let i = 0; i < count; i += 1) {
          const numerator = view.getUint32(offset + i * 8, little);
          const denominator = view.getUint32(offset + i * 8 + 4, little) || 1;
          result.push(numerator / denominator);
        }
        return result;
      };

      const convertGpsValuesToDecimal = (values, ref) => {
        if (!values || values.length < 3) return null;
        const decimal = values[0] + values[1] / 60 + values[2] / 3600;
        if (!ref) return decimal;
        const normalizedRef = ref.trim().toUpperCase();
        if (normalizedRef === "S" || normalizedRef === "W") {
          return -decimal;
        }
        return decimal;
      };

      const parseGpsIfd = (view, offset, base, little) => {
        if (offset <= 0 || offset + 2 > view.byteLength) return null;
        const entryCount = view.getUint16(offset, little);
        let latRef = null;
        let lonRef = null;
        let latValues = null;
        let lonValues = null;
        for (let i = 0; i < entryCount; i += 1) {
          const entryOffset = offset + 2 + i * 12;
          if (entryOffset + 12 > view.byteLength) break;
          const tag = view.getUint16(entryOffset, little);
          const type = view.getUint16(entryOffset + 2, little);
          const count = view.getUint32(entryOffset + 4, little);
          const valueSize = (TYPE_SIZES[type] || 0) * count;
          const rawValueOffset = entryOffset + 8;
          let valueOffset = rawValueOffset;
          if (valueSize > 4) {
            valueOffset = base + view.getUint32(rawValueOffset, little);
          }
          if (tag === GPS_TAGS.LAT_REF && type === 2) {
            latRef = asciiFromView(view, valueOffset, Math.min(count, 2));
          } else if (tag === GPS_TAGS.LON_REF && type === 2) {
            lonRef = asciiFromView(view, valueOffset, Math.min(count, 2));
          } else if (tag === GPS_TAGS.LAT && type === 5 && count >= 3) {
            latValues = readRationalArray(view, valueOffset, little, 3);
          } else if (tag === GPS_TAGS.LON && type === 5 && count >= 3) {
            lonValues = readRationalArray(view, valueOffset, little, 3);
          }
        }
        if (!latValues || !lonValues) return null;
        const latitude = convertGpsValuesToDecimal(latValues, latRef);
        const longitude = convertGpsValuesToDecimal(lonValues, lonRef);
        if (
          typeof latitude !== "number" ||
          Number.isNaN(latitude) ||
          typeof longitude !== "number" ||
          Number.isNaN(longitude)
        ) {
          return null;
        }
        return { latitude, longitude };
      };

      const parseIfdForMetadata = (view, offset, base, little, metadata = {}) => {
        if (offset <= 0 || offset + 2 > view.byteLength) return metadata;
        const entryCount = view.getUint16(offset, little);
        for (let i = 0; i < entryCount; i += 1) {
          const entryOffset = offset + 2 + i * 12;
          if (entryOffset + 12 > view.byteLength) break;
          const tag = view.getUint16(entryOffset, little);
          const type = view.getUint16(entryOffset + 2, little);
          const count = view.getUint32(entryOffset + 4, little);
          const valueSize = (TYPE_SIZES[type] || 0) * count;
          const rawValueOffset = entryOffset + 8;
          let valueOffset = rawValueOffset;
          if (valueSize > 4) {
            valueOffset = base + view.getUint32(rawValueOffset, little);
          }
          if (tag === 0x8769) {
            const pointer = base + view.getUint32(rawValueOffset, little);
            parseIfdForMetadata(view, pointer, base, little, metadata);
            continue;
          }
          if (tag === 0x8825) {
            const pointer = base + view.getUint32(rawValueOffset, little);
            const gps = parseGpsIfd(view, pointer, base, little);
            if (gps) {
              metadata.gps = gps;
            }
            continue;
          }
          if (tag === 0x0112 && type === 3 && count >= 1) {
            const orientation =
              valueSize > 2
                ? view.getUint16(valueOffset, little)
                : view.getUint16(rawValueOffset, little);
            if (orientation) {
              metadata.orientation = orientation;
            }
            continue;
          }
          if (EXIF_DATE_TAGS.has(tag) && type === 2 && count > 0) {
            const raw = asciiFromView(view, valueOffset, count);
            const normalized = normalizeExifDate(raw);
            if (normalized) {
              if (tag === 0x9003) {
                metadata.primaryDate = normalized;
              } else if (!metadata.fallbackDate) {
                metadata.fallbackDate = normalized;
              }
            }
          }
        }
        return metadata;
      };

      const readExifMetadataFromBuffer = (buffer) => {
        const view = new DataView(buffer);
        if (view.byteLength < 12 || view.getUint16(0, false) !== 0xffd8) return {};
        let offset = 2;
        while (offset + 4 < view.byteLength) {
          if (view.getUint8(offset) !== 0xff) break;
          const marker = view.getUint8(offset + 1);
          const length = view.getUint16(offset + 2, false);
          if (marker === 0xe1) {
            const segmentStart = offset + 4;
            const identifier = asciiFromView(view, segmentStart, 4);
            if (identifier !== "Exif") {
              offset += 2 + length;
              continue;
            }
            const tiffStart = segmentStart + 6;
            if (tiffStart + 8 > view.byteLength) break;
            const little = view.getUint16(tiffStart, false) === 0x4949;
            const firstIfdOffset = view.getUint32(tiffStart + 4, little);
            const metadata = parseIfdForMetadata(
              view,
              tiffStart + firstIfdOffset,
              tiffStart,
              little,
              {}
            );
            return {
              date: metadata.primaryDate || metadata.fallbackDate || null,
              gps: metadata.gps || null,
              orientation: metadata.orientation || null,
            };
          }
          offset += 2 + length;
        }
        return {};
      };

      const extractExifMetadata = async (file) => {
        if (!file || !/image\/jpe?g/i.test(file.type || "")) return {};
        try {
          const buffer = await file.arrayBuffer();
          return readExifMetadataFromBuffer(buffer) || {};
        } catch (error) {
          console.warn("EXIF 解析失敗", error);
          return {};
        }
      };

      const applyPhotoMetadata = async (file, dataUrl, extraGps, options = {}) => {
        if (!file) return null;
        const syncDate = options.syncDate !== false;
        const showDateToast = options.showDateToast !== false;
        const recordHistoryEntry = options.recordHistoryEntry !== false;
        const updateOverlay = options.updateOverlay !== false;
        let metadata = {};
        try {
          metadata = await extractExifMetadata(file);
        } catch (error) {
          console.warn("讀取 EXIF 資料失敗", error);
        }
        lastPhotoMetadata =
          metadata && (metadata.date || metadata.gps || metadata.orientation)
            ? { ...metadata }
            : null;
        if (extraGps && typeof extraGps.latitude === "number" && typeof extraGps.longitude === "number") {
          lastPhotoMetadata = lastPhotoMetadata || {};
          lastPhotoMetadata.gps = {
            latitude: extraGps.latitude,
            longitude: extraGps.longitude,
          };
        }
        if (window.piexif && dataUrl) {
          try {
            const exifObj = piexif.load(dataUrl);
            if (exifObj["0th"]) {
              delete exifObj["0th"][piexif.ImageIFD.Orientation];
            }
            lastPhotoExifBytes = extraGps ? null : piexif.dump(exifObj);
          } catch (error) {
            console.warn("EXIF 載入失敗", error);
            lastPhotoExifBytes = null;
          }
        } else {
          lastPhotoExifBytes = null;
        }
        if (lastPhotoMetadata?.orientation) {
          delete lastPhotoMetadata.orientation;
        }
        const exifDate = metadata.date;
        const usedExif = Boolean(exifDate);
        let resolvedDate = exifDate;
        if (!resolvedDate) {
          resolvedDate =
            file.lastModified && Number.isFinite(file.lastModified)
              ? formatDateInputValue(new Date(file.lastModified))
              : formatDateInputValue(new Date());
        }

        if (syncDate) {
          formInputs.testDate.value = resolvedDate;
          syncField("testDate");
        }
        if (showDateToast) {
          showToast(
            usedExif
              ? "已套用照片拍攝日期，如需修改可手動調整。"
              : "已套用拍攝日期，如需修改可手動調整。",
            "success"
          );
        }
        if (updateOverlay) {
          updateCoordinateOverlay();
          applyDisplayMode();
        }
        if (recordHistoryEntry) {
          recordCoordinateHistory();
        }
        return {
          metadata: clonePhotoMetadata(lastPhotoMetadata),
          exifBytes: lastPhotoExifBytes || null,
          resolvedDate,
          usedExif,
        };
      };

      const autoResizeTextarea = (textarea) => {
        if (!textarea) return;
        textarea.style.height = "auto";
        textarea.style.height = `${Math.min(textarea.scrollHeight, 600)}px`;
      };

      const showToast = (message, variant = "info") => {
        toastMessage.textContent = message;
        toastMessage.dataset.variant = variant;
        toastMessage.classList.add("visible");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(
          () => toastMessage.classList.remove("visible"),
          4500
        );
      };

      const updateStageAspect = () => {
        if (photoImage.hidden || !photoImage.naturalWidth) {
          captureArea.style.setProperty("--stage-aspect", "56.25%");
          requestAnimationFrame(positionBoardAtBottomLeft);
          return;
        }
        const ratio = (photoImage.naturalHeight / photoImage.naturalWidth) * 100;
        captureArea.style.setProperty("--stage-aspect", `${ratio}%`);
        requestAnimationFrame(positionBoardAtBottomLeft);
      };

      const sanitizeFileBaseName = (name, fallback = "photo") => {
        const source = (name || fallback).replace(/\.[^.]+$/, "");
        const cleaned = source
          .replace(/[^a-zA-Z0-9_\-\u4e00-\u9fff]+/g, "_")
          .replace(/_+/g, "_")
          .replace(/^_+|_+$/g, "");
        return cleaned || fallback;
      };

      const estimateDataUrlBytes = (dataUrl) => {
        if (typeof dataUrl !== "string") return 0;
        const commaIndex = dataUrl.indexOf(",");
        const base64 = commaIndex >= 0 ? dataUrl.slice(commaIndex + 1) : dataUrl;
        const padding = base64.endsWith("==") ? 2 : base64.endsWith("=") ? 1 : 0;
        return Math.max(0, Math.floor((base64.length * 3) / 4) - padding);
      };

      const normalizeImageDataUrl = async (dataUrl, options = {}) => {
        const maxLongEdge = Number(options.maxLongEdge || IMPORT_TARGET_LONG_EDGE);
        const maxBytes = Number(options.maxBytes || IMPORT_TARGET_MAX_BYTES);
        const startQuality = Number(options.startQuality || IMPORT_JPEG_START_QUALITY);
        const minQuality = Number(options.minQuality || IMPORT_JPEG_MIN_QUALITY);
        const resizePasses = Number(options.resizePasses || IMPORT_RESIZE_PASSES);
        if (!dataUrl || !Number.isFinite(maxLongEdge) || maxLongEdge <= 0) {
          return { dataUrl, changed: false, estimatedBytes: estimateDataUrlBytes(dataUrl) };
        }

        const image = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("IMAGE_DECODE_FAILED"));
          img.src = dataUrl;
        });

        const sourceWidth = image.naturalWidth || image.width;
        const sourceHeight = image.naturalHeight || image.height;
        if (!sourceWidth || !sourceHeight) {
          return { dataUrl, changed: false, estimatedBytes: estimateDataUrlBytes(dataUrl) };
        }

        const sourceLongEdge = Math.max(sourceWidth, sourceHeight);
        const initialRatio = sourceLongEdge > maxLongEdge ? maxLongEdge / sourceLongEdge : 1;
        let targetWidth = Math.max(1, Math.round(sourceWidth * initialRatio));
        let targetHeight = Math.max(1, Math.round(sourceHeight * initialRatio));
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          return { dataUrl, changed: false, estimatedBytes: estimateDataUrlBytes(dataUrl) };
        }

        const drawAndEncode = (width, height, quality) => {
          canvas.width = width;
          canvas.height = height;
          ctx.clearRect(0, 0, width, height);
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(image, 0, 0, width, height);
          return canvas.toDataURL("image/jpeg", quality);
        };

        let changed = initialRatio < 1 || !/^data:image\/jpe?g/i.test(dataUrl);
        let quality = startQuality;
        let optimizedDataUrl = drawAndEncode(targetWidth, targetHeight, quality);
        let optimizedBytes = estimateDataUrlBytes(optimizedDataUrl);

        for (let pass = 0; pass < resizePasses; pass += 1) {
          while (optimizedBytes > maxBytes && quality > minQuality) {
            quality = Math.max(minQuality, Number((quality - 0.05).toFixed(2)));
            optimizedDataUrl = drawAndEncode(targetWidth, targetHeight, quality);
            optimizedBytes = estimateDataUrlBytes(optimizedDataUrl);
            changed = true;
            if (quality === minQuality) break;
          }
          if (optimizedBytes <= maxBytes) break;
          const nextWidth = Math.max(1, Math.round(targetWidth * 0.85));
          const nextHeight = Math.max(1, Math.round(targetHeight * 0.85));
          if (nextWidth === targetWidth && nextHeight === targetHeight) break;
          targetWidth = nextWidth;
          targetHeight = nextHeight;
          quality = startQuality;
          optimizedDataUrl = drawAndEncode(targetWidth, targetHeight, quality);
          optimizedBytes = estimateDataUrlBytes(optimizedDataUrl);
          changed = true;
        }

        const originalBytes = estimateDataUrlBytes(dataUrl);
        const shouldKeepOriginal =
          !changed &&
          targetWidth === sourceWidth &&
          targetHeight === sourceHeight &&
          /^data:image\/jpe?g/i.test(dataUrl) &&
          originalBytes <= maxBytes;
        if (shouldKeepOriginal) {
          return { dataUrl, changed: false, estimatedBytes: originalBytes };
        }
        return {
          dataUrl: optimizedDataUrl,
          changed: changed || optimizedBytes < originalBytes,
          estimatedBytes: optimizedBytes,
        };
      };

      const updateMultiModeUI = () => {
        if (multiModeBtn) {
          multiModeBtn.dataset.multiMode = isMultiMode ? "true" : "false";
          multiModeBtn.setAttribute("aria-pressed", isMultiMode ? "true" : "false");
          multiModeBtn.classList.toggle("is-active", isMultiMode);
          multiModeBtn.textContent = isMultiMode ? "多張模式：開" : "多張模式：關";
        }
        if (uploadInput) {
          uploadInput.multiple = isMultiMode;
        }
        if (uploadPhotoBtn) {
          uploadPhotoBtn.textContent = isMultiMode ? "上傳多張照片" : "上傳照片";
        }
        if (exportAllBtn) {
          exportAllBtn.hidden = !isMultiMode;
          exportAllBtn.disabled = !isMultiMode || photoItems.length === 0;
        }
      };

      const renderPhotoList = () => {
        if (!photoListPanel || !photoList || !photoListCount) return;
        const hasItems = photoItems.length > 0;
        photoListPanel.hidden = !isMultiMode || !hasItems;
        photoListCount.textContent = `${photoItems.length} 張照片`;
        if (!hasItems) {
          photoList.innerHTML = "";
          prevPhotoBtn.disabled = true;
          nextPhotoBtn.disabled = true;
          clearPhotoListBtn.disabled = true;
          if (exportAllBtn && isMultiMode) {
            exportAllBtn.disabled = true;
          }
          return;
        }
        prevPhotoBtn.disabled = photoItems.length <= 1;
        nextPhotoBtn.disabled = photoItems.length <= 1;
        clearPhotoListBtn.disabled = false;
        if (exportAllBtn && isMultiMode) {
          exportAllBtn.disabled = false;
        }
        photoList.innerHTML = "";
        photoItems.forEach((item, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "photo-item-btn";
          if (index === activePhotoIndex) {
            button.classList.add("is-active");
          }
          button.title = item.name || `photo_${index + 1}.jpg`;
          button.setAttribute("aria-label", `第 ${index + 1} 張照片`);
          button.addEventListener("click", () => {
            setActivePhoto(index);
          });
          const img = document.createElement("img");
          img.className = "photo-item-thumb";
          img.loading = "lazy";
          img.decoding = "async";
          img.src = item.dataUrl;
          img.alt = `照片 ${index + 1}`;
          const label = document.createElement("span");
          label.className = "photo-item-index";
          label.textContent = `${index + 1}. ${item.baseName}`;
          button.appendChild(img);
          button.appendChild(label);
          photoList.appendChild(button);
        });
      };

      const setActivePhoto = (index, options = {}) => {
        if (index < 0 || index >= photoItems.length) return;
        const announce = options.announce !== false;
        const keepPosition = options.keepPosition === true;
        const item = photoItems[index];
        activePhotoIndex = index;
        photoImage.src = item.dataUrl;
        photoImage.hidden = false;
        placeholder.style.display = "none";
        lastPhotoMetadata = clonePhotoMetadata(item.metadata);
        lastPhotoExifBytes = item.exifBytes || null;
        formInputs.testDate.value = item.dateValue || "";
        syncField("testDate");
        updateCoordinateOverlay();
        applyDisplayMode();
        if (!keepPosition) {
          whiteboardWrapper.dataset.userPositioned = "false";
          requestAnimationFrame(positionBoardAtBottomLeft);
        }
        updateStageAspect();
        renderPhotoList();
        if (announce) {
          showToast(`已切換到第 ${index + 1} 張照片。`, "success");
        }
      };

      const clearPhotoCollection = (toast = true) => {
        photoItems = [];
        activePhotoIndex = -1;
        photoImage.removeAttribute("src");
        photoImage.hidden = true;
        placeholder.style.display = "flex";
        lastPhotoMetadata = null;
        lastPhotoExifBytes = null;
        updateCoordinateOverlay();
        applyDisplayMode();
        updateStageAspect();
        renderPhotoList();
        if (exportAllBtn) {
          exportAllBtn.disabled = true;
        }
        if (toast) {
          showToast("照片清單已清空。", "success");
        }
      };

      const setMultiMode = (enabled) => {
        const next = Boolean(enabled);
        if (next === isMultiMode) return;
        if (!next && photoItems.length > 1) {
          const keepItem = hasCurrentPhoto() ? photoItems[activePhotoIndex] : photoItems[photoItems.length - 1];
          photoItems = keepItem ? [keepItem] : [];
          activePhotoIndex = keepItem ? 0 : -1;
          if (keepItem) {
            setActivePhoto(0, { announce: false, keepPosition: true });
          }
        }
        isMultiMode = next;
        updateMultiModeUI();
        renderPhotoList();
        if (isMultiMode) {
          showToast("已啟用多張模式，可一次匯入多張照片。", "success");
        } else {
          showToast("已切回單張模式。", "success");
        }
      };

      const shiftActivePhoto = (step) => {
        if (photoItems.length <= 1) return;
        const total = photoItems.length;
        const base = hasCurrentPhoto() ? activePhotoIndex : 0;
        const nextIndex = (base + step + total) % total;
        setActivePhoto(nextIndex);
      };

      const buildPhotoItemFromFile = async (file, captureCoordinates) => {
        const rawDataUrl = await readFileAsDataURL(file);
        let dataUrl = rawDataUrl;
        let optimized = false;
        try {
          const normalized = await normalizeImageDataUrl(rawDataUrl, {
            maxLongEdge: IMPORT_TARGET_LONG_EDGE,
            maxBytes: IMPORT_TARGET_MAX_BYTES,
            startQuality: IMPORT_JPEG_START_QUALITY,
            minQuality: IMPORT_JPEG_MIN_QUALITY,
            resizePasses: IMPORT_RESIZE_PASSES,
          });
          dataUrl = normalized?.dataUrl || rawDataUrl;
          optimized = Boolean(normalized?.changed);
        } catch (error) {
          console.warn("圖片縮放失敗，改用原始圖片", error);
          dataUrl = rawDataUrl;
          optimized = false;
        }
        const metadataResult = await applyPhotoMetadata(file, dataUrl, captureCoordinates, {
          syncDate: false,
          showDateToast: false,
          updateOverlay: false,
        });
        const resolvedDate =
          metadataResult?.resolvedDate ||
          (file.lastModified && Number.isFinite(file.lastModified)
            ? formatDateInputValue(new Date(file.lastModified))
            : formatDateInputValue(new Date()));
        const id = ++photoSequence;
        return {
          id,
          name: file.name || `photo_${id}.jpg`,
          baseName: sanitizeFileBaseName(file.name, `photo_${id}`),
          dataUrl,
          metadata: clonePhotoMetadata(metadataResult?.metadata),
          exifBytes: metadataResult?.exifBytes || null,
          dateValue: resolvedDate,
          usedExif: Boolean(metadataResult?.usedExif),
          optimized,
        };
      };

      const handlePhotoFiles = async (files) => {
        const fileArray = Array.from(files || []).filter(Boolean);
        if (!fileArray.length) return;
        const captureCoordinates = await consumePendingCaptureCoordinates();
        const loadedItems = [];
        let gpsCount = 0;
        let optimizedCount = 0;
        for (const file of fileArray) {
          try {
            const item = await buildPhotoItemFromFile(file, captureCoordinates);
            loadedItems.push(item);
            if (item.optimized) {
              optimizedCount += 1;
            }
            const hasGps =
              item.metadata &&
              typeof item.metadata.gps?.latitude === "number" &&
              typeof item.metadata.gps?.longitude === "number";
            if (hasGps) {
              gpsCount += 1;
            }
          } catch (error) {
            console.warn("讀取照片失敗", error);
          }
        }
        if (!loadedItems.length) {
          showToast("無法讀取任何照片，請重新選擇。");
          return;
        }
        if (isMultiMode) {
          const startIndex = photoItems.length;
          photoItems = photoItems.concat(loadedItems);
          updateMultiModeUI();
          setActivePhoto(startIndex, { announce: false });
          const message =
            gpsCount > 0
              ? `已加入 ${loadedItems.length} 張照片，取得 ${gpsCount} 筆座標。`
              : `已加入 ${loadedItems.length} 張照片，但沒有可用座標。`;
          const optimizedSuffix = optimizedCount > 0 ? ` 已自動優化 ${optimizedCount} 張尺寸。` : "";
          showToast(`${message}${optimizedSuffix}`, gpsCount > 0 || optimizedCount > 0 ? "success" : undefined);
          return;
        }
        if (loadedItems.length > 1) {
          showToast("單張模式只保留最後一張，若要管理全部請先開啟多張模式。");
        }
        photoItems = [loadedItems[loadedItems.length - 1]];
        updateMultiModeUI();
        setActivePhoto(0, { announce: false });
        const current = photoItems[0];
        showToast(
          current.usedExif
            ? current.optimized
              ? "已載入照片並自動優化尺寸，套用拍攝日期。"
              : "已載入照片並套用拍攝日期。"
            : current.optimized
              ? "已載入照片並自動優化尺寸，可手動調整日期與白板。"
              : "已載入照片，可手動調整日期與白板。",
          "success"
        );
      };

      const applyColorPreset = (button) => {
        if (!button?.dataset) return;
        const { boardColor, textColor, lineColor, boardOpacity } = button.dataset;
        if (boardColor) {
          boardColorInput.value = boardColor;
          updateBoardColor(boardColor);
        }
        if (textColor) {
          textColorInput.value = textColor;
          updateTextColor(textColor);
        }
        if (lineColor) {
          lineColorInput.value = lineColor;
          updateLineColor(lineColor);
        }
        if (boardOpacity) {
          boardOpacityInput.value = boardOpacity;
          updateBoardOpacity(boardOpacity);
        }
        showToast("已套用預設配色。", "success");
      };

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      const startDrag = (event) => {
        if (event.target.closest("input, textarea, button, select")) return;
        whiteboardWrapper.dataset.dragging = "true";
        whiteboardWrapper.dataset.userPositioned = "true";
        const rect = whiteboardWrapper.getBoundingClientRect();
        whiteboardWrapper.dataset.offsetX =
          (event.clientX ?? event.touches?.[0]?.clientX ?? 0) - rect.left;
        whiteboardWrapper.dataset.offsetY =
          (event.clientY ?? event.touches?.[0]?.clientY ?? 0) - rect.top;
        whiteboardWrapper.dataset.stageRect = JSON.stringify(
          captureArea.getBoundingClientRect()
        );
      };

      const dragMove = (event) => {
        if (whiteboardWrapper.dataset.dragging !== "true") return;
        event.preventDefault();
        const stageRect = JSON.parse(whiteboardWrapper.dataset.stageRect);
        const boardRect = whiteboardWrapper.getBoundingClientRect();
        const offsetX = parseFloat(whiteboardWrapper.dataset.offsetX);
        const offsetY = parseFloat(whiteboardWrapper.dataset.offsetY);
        const pointerX = event.clientX ?? event.touches?.[0]?.clientX ?? 0;
        const pointerY = event.clientY ?? event.touches?.[0]?.clientY ?? 0;
        const newLeft = clamp(
          pointerX - stageRect.left - offsetX + boardRect.width / 2,
          boardRect.width / 2,
          stageRect.width - boardRect.width / 2
        );
        const newTop = clamp(
          pointerY - stageRect.top - offsetY + boardRect.height / 2,
          boardRect.height / 2,
          stageRect.height - boardRect.height / 2
        );
        whiteboardWrapper.style.left = `${(newLeft / stageRect.width) * 100}%`;
        whiteboardWrapper.style.top = `${(newTop / stageRect.height) * 100}%`;
      };

      const endDrag = () => {
        whiteboardWrapper.dataset.dragging = "false";
      };

      const positionBoardAtBottomLeft = () => {
        if (whiteboardWrapper.dataset.userPositioned === "true") return;
        const stageRect = captureArea.getBoundingClientRect();
        if (!stageRect.width || !stageRect.height) return;
        const boardRect = whiteboardWrapper.getBoundingClientRect();
        if (!boardRect.width || !boardRect.height) return;
        const photoRect =
          !photoImage.hidden && photoImage.naturalWidth
            ? photoImage.getBoundingClientRect()
            : stageRect;
        const paddingX = Math.max(8, stageRect.width * 0.012);
        const paddingY = Math.max(8, stageRect.height * 0.012);
        const leftEdge = Math.max(photoRect.left, stageRect.left) + paddingX;
        const bottomEdge = Math.min(photoRect.bottom, stageRect.bottom) - paddingY;
        const centerX = clamp(
          leftEdge - stageRect.left + boardRect.width / 2,
          boardRect.width / 2,
          stageRect.width - boardRect.width / 2
        );
        const centerY = clamp(
          bottomEdge - stageRect.top - boardRect.height / 2,
          boardRect.height / 2,
          stageRect.height - boardRect.height / 2
        );
        whiteboardWrapper.style.left = `${(centerX / stageRect.width) * 100}%`;
        whiteboardWrapper.style.top = `${(centerY / stageRect.height) * 100}%`;
      };

      let baseBoardScale = Number(boardScaleInput.value) / 100;
      let fontScaleFactor = Number(fontScaleInput.value) / 100;

      const applyScale = () => {
        const combinedScale = baseBoardScale * fontScaleFactor;
        const baseOverlayScale = combinedScale * fontScaleFactor * 0.96;
        // User feedback indicates the watermark is still too large.
        // Applying a manual adjustment to reduce it by about half.
        let overlayScale = baseOverlayScale / 2;
        if (isMobileDevice) {
          overlayScale *= 2;
        }
        whiteboardWrapper.style.setProperty("--board-scale", combinedScale.toString());
        document.documentElement.style.setProperty("--whiteboard-font-scale", fontScaleFactor.toString());
        document.documentElement.style.setProperty("--whiteboard-overlay-scale", overlayScale.toString());
      };

      const updateBoardScale = (value) => {
        const percent = Math.max(10, Math.min(120, Number(value)));

        if (whiteboardWrapper.dataset.userPositioned !== "true") {
          requestAnimationFrame(positionBoardAtBottomLeft);

        fontScaleValue.textContent = `${percent}%`;

          requestAnimationFrame(positionBoardAtBottomLeft);

      const updateBoardColor = (color) => {

      const handleShareOrDownload = async (blob, filename) => {

      const waitForPhotoReady = async () => {

      const withTimeout = (promise, timeoutMs, code = "TIMEOUT") =>
        new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            const err = new Error(code);
            err.code = code;
            reject(err);
          }, timeoutMs);
          promise
            .then((value) => {
              clearTimeout(timer);
              resolve(value);
            })
            .catch((error) => {
              clearTimeout(timer);
              reject(error);
            });
