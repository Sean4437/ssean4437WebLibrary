      const resolveSafeExportScale = (scale) => {
        const stageWidth = captureArea?.clientWidth || captureArea?.offsetWidth || 0;
        const stageHeight = captureArea?.clientHeight || captureArea?.offsetHeight || 0;
        const baseScale = Number(scale) || 1;
        if (!stageWidth || !stageHeight) {
          return Math.max(EXPORT_MIN_SCALE, Math.min(baseScale, EXPORT_SCALE_MAX));
        }
        const currentPixels = stageWidth * stageHeight * baseScale * baseScale;
        if (currentPixels <= EXPORT_MAX_TOTAL_PIXELS) {
          return Math.max(EXPORT_MIN_SCALE, Math.min(baseScale, EXPORT_SCALE_MAX));
        }
        const ratio = Math.sqrt(EXPORT_MAX_TOTAL_PIXELS / currentPixels);
        const adjusted = baseScale * ratio;
        return Math.max(EXPORT_MIN_SCALE, Math.min(adjusted, EXPORT_SCALE_MAX));
      };

      const buildHtml2CanvasOptions = (scale) => {
        const exportBg =
          (captureArea && window.getComputedStyle(captureArea).backgroundColor) || "#0f172a";
        const safeScale = resolveSafeExportScale(scale);
        const rect = captureArea?.getBoundingClientRect?.();
        const width = Math.max(
          1,
          Math.round(
            captureArea?.clientWidth ||
              captureArea?.offsetWidth ||
              rect?.width ||
              1
          )
        );
        const height = Math.max(
          1,
          Math.round(
            captureArea?.clientHeight ||
              captureArea?.offsetHeight ||
              rect?.height ||
              1
          )
        );
        return {
          backgroundColor: exportBg,
          scale: safeScale,
          logging: false,
          imageTimeout: 0,
          removeContainer: true,
          width,
          height,
          windowWidth: width,
          windowHeight: height,
          scrollX: 0,
          scrollY: 0,
        };
      };

      const captureCanvasWithScale = async (scale, timeoutMs = EXPORT_RENDER_TIMEOUT_MS) => {
        return withTimeout(
          html2canvas(captureArea, buildHtml2CanvasOptions(scale)),
          timeoutMs,
          "EXPORT_TIMEOUT"
        );
      };

      const shouldFallbackToManual = (error) => {
        const code = String(error?.code || error?.name || "").toUpperCase();
        if (
          code === "EXPORT_TIMEOUT" ||
          code === "TIMEOUT" ||
          code === "ABORTERROR" ||
          code === "SECURITYERROR"
        ) {
          return true;
        }
        const message = String(error?.message || "").toLowerCase();
        return (
          message.includes("timeout") ||
          message.includes("timed out") ||
          message.includes("security") ||
          message.includes("tainted")
        );
      };

      const renderExportBlobByHtml2Canvas = async (options = {}) => {
        if (typeof html2canvas !== "function") {
          const err = new Error("MISSING_HTML2CANVAS");
          err.code = "MISSING_HTML2CANVAS";
          throw err;
        }
        const baseScale = window.devicePixelRatio || 1;
        const sizeMultiplier = EXPORT_SIZE_SCALE[exportSize] || 1;
        const requestedScale = baseScale * sizeMultiplier;
        const speedScaleCap = isMobileDevice
          ? EXPORT_FAST_MAX_SCALE_MOBILE
          : EXPORT_FAST_MAX_SCALE_DESKTOP;
        const exportScale = Math.min(requestedScale, speedScaleCap);
        const canvas = await captureCanvasWithScale(exportScale, EXPORT_RENDER_TIMEOUT_MS);
        const isPortrait = canvas.height >= canvas.width;
        let blob = await encodeCanvasAsJpeg(canvas, {
          maxBytes: EXPORT_TARGET_MAX_BYTES,
          startQuality: EXPORT_JPEG_START_QUALITY,
          minQuality: EXPORT_JPEG_MIN_QUALITY,
          qualityStep: EXPORT_JPEG_QUALITY_STEP,
        });
        if (EXPORT_KEEP_EXIF) {
          blob = await attachExifToBlob(blob);
        }
        const timestamp = new Date().toISOString().replace(/[T:]/g, "-").split(".")[0];
        const baseName = sanitizeFileBaseName(options.filenameBase || "whiteboard", "whiteboard");
        const filename = `${baseName}_${timestamp}${isPortrait ? "_portrait" : "_landscape"}.jpg`;
        return { blob, filename };
      };

      const renderExportBlob = async (options = {}) => {
        await waitForPhotoReady();
        if (photoImage.hidden || !photoImage.naturalWidth) {
          const err = new Error("NO_PHOTO_FOR_EXPORT");
          err.code = "NO_PHOTO_FOR_EXPORT";
          throw err;
        }
        toggleExportAppearance(true);
        toggleWhiteboardSolid(true);
        try {
          if (EXPORT_PREFER_MANUAL_PIPELINE) {
            try {
              return await renderExportBlobManual(options);
            } catch (manualError) {
              if (manualError?.code === "NO_PHOTO_FOR_EXPORT") {
                throw manualError;
              }
              console.warn("手動畫布合成失敗，改用 html2canvas 匯出", manualError);
              return await renderExportBlobByHtml2Canvas(options);
            }
          }
          try {
            return await renderExportBlobByHtml2Canvas(options);
          } catch (error) {
            if (!shouldFallbackToManual(error)) {
              throw error;
            }
            console.warn("html2canvas 匯出失敗，改用手動畫布合成", error);
            return await renderExportBlobManual(options);
          }
        } finally {
          toggleExportAppearance(false);
          toggleWhiteboardSolid(false);
        }
      };

      const exportBoardImage = async () => {
        exportBtn.disabled = true;
        exportBtn.textContent = "匯出中…";
        if (exportAllBtn && isMultiMode) {
          exportAllBtn.disabled = true;
        }
        try {
          const baseName =
            hasCurrentPhoto() && photoItems[activePhotoIndex]
              ? `whiteboard_${photoItems[activePhotoIndex].baseName}`
              : "whiteboard";
          const { blob, filename } = await renderExportBlob({ filenameBase: baseName });
          await handleShareOrDownload(blob, filename);
        } catch (error) {
          console.error(error);
          if (error?.code === "MISSING_HTML2CANVAS") {
            showToast("匯出元件未載入，請重新整理頁面後再試。");
          } else if (error?.code === "NO_PHOTO_FOR_EXPORT") {
            showToast("請先拍照或上傳照片再匯出。");
          } else {
            showToast("匯出失敗，請再試一次。");
          }
        } finally {
          exportBtn.disabled = false;
          exportBtn.textContent = "匯出整張圖片";
          if (exportAllBtn && isMultiMode) {
            exportAllBtn.disabled = !photoItems.length;
          }
        }
      };

      const exportAllBoardImages = async () => {
        if (!isMultiMode) {
          showToast("請先切換到多張模式。");
          return;

        if (!photoItems.length) {
          showToast("目前沒有可批次匯出的照片。");
          return;
        }
        exportBtn.disabled = true;
        if (exportAllBtn) {
          exportAllBtn.disabled = true;
          exportAllBtn.textContent = "批次匯出中…";
        }
        const previousIndex = hasCurrentPhoto() ? activePhotoIndex : 0;
        try {
          for (let i = 0; i < photoItems.length; i += 1) {
            const item = photoItems[i];
            if (exportAllBtn) {
              exportAllBtn.textContent = `批次匯出中… ${i + 1}/${photoItems.length}`;
            }
            setActivePhoto(i, { announce: false, keepPosition: true });
            await new Promise((resolve) => setTimeout(resolve, 0));
            const { blob, filename } = await renderExportBlob({
              filenameBase: `whiteboard_${String(i + 1).padStart(2, "0")}_${item.baseName}`,
            });
            downloadBlob(blob, filename);
            await new Promise((resolve) => setTimeout(resolve, 120));
          }
          showToast(`已完成 ${photoItems.length} 張批次匯出。`, "success");
        } catch (error) {
          console.error(error);
          if (error?.code === "MISSING_HTML2CANVAS") {
            showToast("匯出元件未載入，請重新整理頁面後再試。");

      updateDisplayModeButton();
      renderPhotoList();
      syncAllFields();
      updateBoardScale(boardScaleInput.value);
      updateFontScale(fontScaleInput.value);
      updateBoardWidth(boardWidthInput.value);
      updateBoardRotation(boardRotationInput.value);
      updateBoardColor(boardColorInput.value);
      updateBoardOpacity(boardOpacityInput.value);
      updateTextColor(textColorInput.value);
      updateLineColor(lineColorInput.value);
      updateWatermarkDate();
      updateCoordinateOverlay();
      applyDisplayMode();
      enableFieldDragReorder();
      applyFieldLabels();
      REORDERABLE_FIELD_KEYS.forEach(renderLabelHistorySelect);
      applyFieldOrderToDOM();
      applyFieldVisibility();
      renderWhiteboardFields();
      requestAnimationFrame(positionBoardAtBottomLeft);

      toggleAdvanced.addEventListener("click", () => {
        const isHidden = advancedControls.hasAttribute("hidden");
        if (isHidden) {
          advancedControls.removeAttribute("hidden");
          toggleAdvanced.textContent = "隱藏更多調整";
        } else {
          advancedControls.setAttribute("hidden", "true");
          toggleAdvanced.textContent = "顯示更多調整";
        }
      });
      autoResizeTextarea(formInputs.testResult);
      formInputs.testResult.addEventListener("input", () => {
        autoResizeTextarea(formInputs.testResult);
        showFieldHistory("testResult");
      });
      formInputs.testDate.addEventListener("change", () =>
        syncField("testDate")
      );

    </script>
  </body>
</html>
